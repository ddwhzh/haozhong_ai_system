[project]
name = "haozhong-multi-agent-system"
version = "0.1.0"
description = "Multi-Agent system with managed pyramid architecture: Retrieval, Generation, Evaluation agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Web framework
    "fastapi>=0.121.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "sse-starlette>=1.6.0",
    "httpx>=0.27.0",
    # LangChain / LangGraph
    "langchain>=1.0.5",
    "langchain-core>=1.0.4",
    "langchain-openai>=1.0.2",
    "langchain-community>=0.4.1",
    "langgraph>=1.0.2",
    "langgraph-checkpoint-postgres>=3.0.1",
    # Observability
    "langfuse>=3.0.0",
    "structlog>=25.2.0",
    "prometheus-client>=0.19.0",
    "starlette-prometheus>=0.7.0",
    # Database
    "psycopg[binary,pool]>=3.3.2",
    "psycopg2-binary>=2.9.10",
    "sqlmodel>=0.0.24",
    # Neo4j
    "neo4j>=5.28.0",
    # Scientific computing (Hungarian matching, scoring)
    "numpy>=2.2.0",
    "scipy>=1.15.0",
    # Auth / Security
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.4.0",
    "bcrypt>=4.3.0",
    "email-validator>=2.2.0",
    # Config / Utils
    "pydantic[email]>=2.11.1",
    "pydantic-settings>=2.8.1",
    "python-dotenv>=1.1.0",
    "tenacity>=9.1.2",
    "asgiref>=3.8.1",
    "jieba>=0.42.1",
    "stopwordsiso>=0.6.1",
]

[project.optional-dependencies]
dev = ["black", "isort", "ruff", "pytest", "httpx"]

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow"]
python_files = ["test_*.py", "*_test.py"]

[tool.black]
line-length = 119
exclude = "venv|migrations"

[tool.isort]
profile = "black"
multi_line_output = "VERTICAL_HANGING_INDENT"
force_grid_wrap = 2
line_length = 119

[tool.ruff]
line-length = 119
exclude = ["migrations", "*.ipynb", "venv"]

[tool.ruff.lint]
select = ["E", "F", "B", "ERA", "D"]
ignore = ["E501", "F401", "D203", "D213", "B904", "B008"]
unfixable = ["B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
